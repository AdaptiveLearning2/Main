[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-learning-platform"
version = "0.1.0"
description = "Secure real-time EEG-driven adaptive learning platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "starlette>=1.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "numpy>=2.0.0",
  "scipy>=1.14.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "httpx>=0.27.0",
  "pip-tools>=7.5.0"
]
# Camera capture; optional, so the sidecar boots without it. No rPPG library: pulse is `pos_rppg`.
# opencv < 5: `cv2.data.haarcascades` and CAP_PROP_* are unverified on 5.x and CI has no OpenCV.
# `opencv-contrib-python`, never also `opencv-python`: both install `cv2` and the last one wins.
face = [
  "opencv-contrib-python>=4.9.0,<5",
  "onnxruntime>=1.17.0"
]

# Gaze only needs MediaPipe (~50 MB, off by default). Install `.[face,gaze]`.
# < 2: majors break the API (1.0 removed `mp.solutions`) and CI has no MediaPipe.
gaze = [
  "mediapipe>=1.0,<2",
  # mediapipe's own dependency, restated so the cap matches `face`'s.
  "opencv-contrib-python>=4.9.0,<5"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]
