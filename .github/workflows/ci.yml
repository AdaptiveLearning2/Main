name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eegresearch-tests:
    name: EEGResearch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EEGResearch (with dev deps)
        working-directory: EEGResearch
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: EEGResearch
        env:
          EEG_SOURCE: sim
          API_TOKEN: dummy-learner-token-for-ci
          ADMIN_TOKEN: dummy-admin-token-for-ci
        run: pytest

  native-bridge-build:
    name: Native bridge build
    # Windows, not ubuntu: bridge_tcp_server.h includes <winsock2.h> and
    # CMakeLists links Ws2_32 unconditionally, so the bridge does not build on
    # Linux even with ENABLE_LIBMUSE=OFF.
    #
    # ENABLE_LIBMUSE=OFF because the libMuse paths need a vendored SDK we
    # cannot ship to CI. That still compiles every file, so syntax errors, bad
    # signatures and type mistakes are caught -- which is what has been
    # slipping through, across #18 and #20. It does NOT cover the code inside
    # the ENABLE_LIBMUSE guards, which is most of the packet handling; that
    # still needs a manual Windows build with the SDK before release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: EEGResearch/native_bridge
        run: cmake -S . -B build -DENABLE_LIBMUSE=OFF

      - name: Build
        working-directory: EEGResearch/native_bridge
        run: cmake --build build --config Release

  website-backend:
    name: Website backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev.txt, not requirements.txt: it pulls in the runtime
      # requirements via `-r` and adds pytest, which the test step below needs.
      - name: Install dependencies
        working-directory: Website/AdaptiveLearning/backend
        run: pip install -r requirements-dev.txt

      - name: Import sanity check
        working-directory: Website/AdaptiveLearning/backend
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
        run: python -c "import main"

      # Access-control tests. These matter more than most: the endpoints they
      # cover read student data through the service-role client, which bypasses
      # RLS, so these checks are the only thing enforcing who can see what.
      - name: Run tests
        working-directory: Website/AdaptiveLearning/backend
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -q
          else
            echo "no tests/ directory yet — skipping"
          fi

  database-grants:
    name: Database grants
    runs-on: ubuntu-latest
    # Two checks, one trap. Supabase ships ALTER DEFAULT PRIVILEGES granting to
    # anon and authenticated *by name* -- EXECUTE on new functions, and every
    # privilege on new tables -- so both arrive fully granted before a migration
    # says anything, and a narrow GRANT on top narrows nothing. Only an explicit
    # REVOKE does.
    #
    # For functions that means callable by anyone holding the anon key, which
    # ships in the frontend bundle. For tables RLS covers most of it, but not
    # TRUNCATE, which RLS does not filter at all -- verified as anon against a
    # local stack. The backend reads through the service-role client and
    # bypasses RLS, so these revokes are load bearing rather than tidiness.
    #
    # This is a lint rather than a database default because the database
    # default does not work: ALTER DEFAULT PRIVILEGES ... REVOKE EXECUTE ON
    # FUNCTIONS FROM PUBLIC, anon, authenticated was tried against a local
    # Supabase stack on 2026-08-04 and new functions still came back with the
    # PUBLIC grant, executable by both roles. The script's docstring has the
    # full reproduction.
    #
    # Separate job rather than a step in database-migrations below: it is pure
    # text analysis over supabase/migrations, needs no Docker and no Supabase
    # stack, and finishes in under a second. Bolting it onto that job would
    # make a fast, deterministic check wait on a container pull.
    #
    # Stdlib only, so no dependency install step and nothing to pin.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The parser first. A regex over SQL has two failure modes and both are
      # quiet: missing a real leak, and failing correct SQL so the next person
      # learns to ignore the job. The cases cover an unqualified CREATE (lands
      # in public and is world-executable there), comma-separated grantees in
      # one statement, commented-out CREATEs and REVOKEs, and a revoke that
      # arrives in a later migration than the CREATE.
      - name: Self-test the parsers
        run: |
          python scripts/check_function_grants.py --self-test
          python scripts/check_table_grants.py --self-test

      - name: Check public-schema functions revoke EXECUTE
        run: python scripts/check_function_grants.py

      # Tables only have to revoke; what is granted back is per-table judgement
      # and stays with review. user_math_performance genuinely needs INSERT and
      # UPDATE for the frontend's upsert under "perf: own"; heart_signals needs
      # SELECT and nothing else. Encoding that here would mean encoding the
      # whole access model in a lint.
      - name: Check public-schema tables revoke the default grants
        run: python scripts/check_table_grants.py

  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    # Nothing in CI applied the migrations before this job. The "Supabase
    # Preview" check reported by the Supabase GitHub app is a per-PR preview
    # branch on the hosted project, and it reports "skipped" -- the feature is
    # switched off in the project's integration settings, so a migration could
    # reach main having never been executed anywhere but a developer's laptop.
    #
    # This runs the real thing rather than a bare postgres: the migrations
    # reference auth.uid() and grant to the anon / authenticated / service_role
    # roles, none of which exist in stock postgres. The local Supabase stack
    # ships all of them, so a migration that passes here is one that will apply
    # against the hosted project.
    steps:
      - uses: actions/checkout@v4

      # Pinned, and pinned to match the repo-local CLI in package.json
      # ("supabase": "^2.108.0"), which is what developers actually run. On
      # `latest` this job validates migrations against a different CLI -- and a
      # different bundled Postgres image -- than anyone uses locally, and an
      # unrelated CLI release can turn it red on a PR that touched no SQL.
      # Bump this and the package.json range together.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      # Excludes the services that take no part in applying SQL. The database
      # container still comes up, and it is the one that ships the anon /
      # authenticated / service_role roles and auth.uid() -- so does gotrue,
      # which owns the auth schema the migrations reference.
      #
      # logflare and vector are excluded even though config.toml has
      # [analytics] enabled = true, which is a coupling the CLI is entitled to
      # start rejecting. It is fine on the pinned version above, and validated
      # by this job's own run -- so re-check it when bumping that pin.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      # `supabase start` above already applied the migrations to an empty
      # database, so this is a second application and not, by itself, a
      # stronger test than the first. It earns its place by isolating the
      # assertion: a failure in this step is a migration failure, where a
      # failure in `start` could equally be an image pull or a container that
      # would not come up.
      #
      # --no-seed states the same narrowness. config.toml has [db.seed]
      # enabled pointing at ./seed.sql, but that file is gitignored, so in CI
      # there is nothing to seed and an unflagged reset just warns about the
      # missing pattern. The flag drops the warning now, and keeps this step
      # asserting only that the migrations apply if seed.sql is ever tracked.
      - name: Apply migrations from scratch
        run: supabase db reset --no-seed

      # RLS is enforced by Postgres, so the backend suite -- which drives main.py
      # against a fake client -- cannot test it. This is the only job with a real
      # stack, so it is the only place the assertions can run. Previously done by
      # hand once and written up in a PR description, which caught the schema on
      # one afternoon and could not catch a later migration re-widening a grant.
      - name: Assert signal-table RLS and CHECK constraints
        run: psql "$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')" -v ON_ERROR_STOP=1 -f scripts/assert_signal_rls.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  frontend-build:
    name: Frontend tests, build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Website/AdaptiveLearning/frontend/package-lock.json

      - name: Install dependencies
        working-directory: Website/AdaptiveLearning/frontend
        run: npm ci

      # Reported, not enforced. The frontend currently has ~48 pre-existing
      # eslint errors (unused imports, set-state-in-effect, and a batch of
      # false-positive "unused" reports for components only referenced in JSX).
      # Blocking on those would make CI red from its first run, which trains
      # everyone to ignore it. Burn the backlog down, then drop this flag.
      - name: Lint (non-blocking)
        continue-on-error: true
        working-directory: Website/AdaptiveLearning/frontend
        run: npm run lint

      # Blocking, unlike lint. These start green and cover behaviour that has
      # already regressed once (percent scaling on the parent report, the
      # ClassDetail render crashes), so there is no backlog to burn down first.
      - name: Test
        working-directory: Website/AdaptiveLearning/frontend
        run: npm test

      - name: Build
        working-directory: Website/AdaptiveLearning/frontend
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: dummy-key-for-ci
          VITE_API_URL: http://localhost:8000
        run: npm run build

  # Known vulnerabilities in what we install. Blocking, unlike lint: a CVE is
  # not a style backlog to burn down, and every step below names the advisory
  # and the fixed version, so a red run says what to do.
  #
  # Three Python sets, not one. They are genuinely separate installs -- the
  # backend pins direct dependencies in requirements.txt and lets pip resolve
  # the rest, the sidecar installs from pyproject, and the four `.lock` files
  # are a third thing again: committed, pinned, and consumed by nothing in the
  # root workflow. They are audited because they are checked in and a developer
  # can install them, which is the only reason a stale one is a live exposure.
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Every audit step below is `continue-on-error` with an `id`, and the
      # last step fails the job on any of them. Otherwise the first finding
      # aborts the job and hides the rest -- which is the opposite of what a
      # scanner is for, and is what happened here: a red lock-file audit meant
      # the frontend was never evaluated at all.

      # Its own virtualenv. Sharing one environment between this and the
      # sidecar makes both readings wrong: pip leaves this file's
      # `fastapi==0.141.1` in place against the sidecar's `fastapi>=0.115.0`,
      # so the sidecar is audited at the backend's versions, and every
      # backend-only package is then reported under the sidecar's heading.
      #
      # The environment, not the file: requirements.txt pins direct
      # dependencies only, so auditing it alone would miss the transitive tree
      # -- which is where starlette, urllib3 and idna live.
      - name: Audit the website backend
        id: audit-backend
        continue-on-error: true
        working-directory: Website/AdaptiveLearning/backend
        run: |
          # Outside the working tree. `.gitignore` covers `.venv` and `venv`
          # and says it names those two deliberately, so a venv called anything
          # else is untracked clutter the moment someone reproduces a red run
          # locally -- and the reason those rules are unanchored in the first
          # place is that a nested venv was once missed. Building it in the
          # runner's temp directory means there is nothing to ignore.
          venv="$(mktemp -d)/venv"
          python -m venv "$venv"
          # The venv ships its own pip, which has advisories of its own and is
          # not a dependency of this product -- unupgraded it is 12 findings
          # under a heading that says "website backend", which is the kind of
          # noise that gets a scanner ignored. Upgrading is the honest fix;
          # excluding it by name would also hide a real pip advisory.
          "$venv/bin/pip" install --quiet --upgrade pip
          "$venv/bin/pip" install --quiet -r requirements-dev.txt
          # Asked for, not spelled out: a hardcoded `lib/python3.12/...` breaks
          # silently the day setup-python's version moves, and a pip-audit that
          # finds nothing because it looked in an empty directory reads exactly
          # like a clean audit.
          pip-audit --path "$("$venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

      # Resolved from pyproject into a clean environment, which is what makes
      # this the versions the `EEGResearch tests` job runs against.
      - name: Audit the EEG sidecar
        id: audit-sidecar
        continue-on-error: true
        working-directory: EEGResearch
        run: |
          venv="$(mktemp -d)/venv"
          python -m venv "$venv"
          "$venv/bin/pip" install --quiet --upgrade pip
          "$venv/bin/pip" install --quiet -e ".[dev]"
          # `--skip-editable`: the sidecar itself is installed editable and is
          # not on PyPI, so auditing it can only ever report that it could not
          # be looked up.
          pip-audit --skip-editable \
            --path "$("$venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

      # `--no-deps`, because the point of a lock file is that it already names
      # every version. Resolving it would audit what pip would pick today,
      # which is the question the two steps above already answer.
      - name: Audit the committed lock files
        id: audit-locks
        continue-on-error: true
        working-directory: EEGResearch
        run: |
          status=0
          for lock in requirements.lock requirements-dev.lock \
                      requirements-face.lock requirements-gaze.lock; do
            echo "::group::$lock"
            pip-audit -r "$lock" --no-deps || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Website/AdaptiveLearning/frontend/package-lock.json

      # `--omit=dev` is the gate, because dev-vs-prod is the axis that decides
      # whether an advisory can reach a child's browser, and `--audit-level`
      # alone does not express it: measured on this lockfile, 8 of the 11 high
      # findings are build tooling and 3 ship. Gating on severity alone made
      # the job red for eight things nobody can act on, which is how a security
      # job becomes one nobody reads.
      #
      # The full audit still prints, so a dev-only advisory is visible to
      # anyone who looks -- it just does not fail the build.
      - name: Audit the frontend
        id: audit-frontend
        continue-on-error: true
        working-directory: Website/AdaptiveLearning/frontend
        run: |
          echo "::group::every advisory, including dev-only build tooling"
          npm audit || true
          echo "::endgroup::"
          npm audit --omit=dev --audit-level=high

      # The gate. Named outcomes rather than a bare `failure()`, so the summary
      # says which set is dirty without opening the log.
      #
      # Three outcomes, not two: an audit that *ran and found something* and an
      # audit that *never ran* both have to fail the job, and they are
      # different facts. `!= success` collapses them, so a failed
      # `Install pip-audit` or a failed `setup-node` -- which skip the audits
      # below them -- would be annotated "has known vulnerabilities" about a
      # set nothing looked at. Failing closed is right; naming the wrong cause
      # on the one step whose whole job is to name the cause is not.
      - name: Fail if any audit found something, or did not run
        if: always()
        run: |
          status=0
          for pair in \
            "website backend:${{ steps.audit-backend.outcome }}" \
            "EEG sidecar:${{ steps.audit-sidecar.outcome }}" \
            "committed lock files:${{ steps.audit-locks.outcome }}" \
            "frontend (shipped deps):${{ steps.audit-frontend.outcome }}"; do
            name="${pair%:*}"; outcome="${pair##*:}"
            case "$outcome" in
              success)
                ;;
              failure)
                echo "::error::$name has known vulnerabilities"
                status=1
                ;;
              *)
                # skipped, cancelled, or an empty string if the id ever stops
                # matching a step -- that last one is why this is the default
                # arm rather than a list of the two known values.
                echo "::error::$name was not audited (step outcome: ${outcome:-none}); this is a broken job, not a clean result"
                status=1
                ;;
            esac
          done
          exit $status

  # Secrets that reached a commit. `.env` is gitignored and nothing is in-repo
  # today, which is the state this exists to keep.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history, not the diff. A key committed and then removed is
          # still a leaked key -- the commit is what GitHub serves, not the
          # tip. It also means this job's first run is the audit of everything
          # already here.
          fetch-depth: 0

      # The binary, not `gitleaks/gitleaks-action`: that action requires a
      # `GITLEAKS_LICENSE` for repositories owned by an organisation, and this
      # one is. The action would fail on a missing secret rather than on a
      # finding, which is the worst way for a security job to be red.
      # Pinned by digest, not just by tag. A tag can be moved to a different
      # artefact, and this job's own dependabot entry argues that a moving tag
      # is a supply-chain path into CI -- fetching a tarball by tag and running
      # it as root-installed without checking it would be that exact hole, in
      # the change that names it. The digest is upstream's published checksum
      # for this asset; bump both together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # `--redact` so a finding does not print the secret into a public build
      # log, which would leak it a second time to a wider audience than the
      # commit did.
      - name: Scan history
        run: gitleaks detect --source . --redact --verbose
