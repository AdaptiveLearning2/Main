version: 2

# Four ecosystems: backend pins, sidecar pyproject, frontend lockfile, workflow actions.
# Weekly; `Dependency scan` in ci.yml surfaces urgent ones. Minor+patch grouped per
# ecosystem; a major is its own PR, except github-actions (runner/Node bumps arrive together).
updates:
  - package-ecosystem: pip
    directory: /Website/AdaptiveLearning/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # First, since a dependency joins the first matching group. supabase pins postgrest
      # exactly and main.py imports postgrest, so both move together, majors included.
      supabase:
        patterns: ["supabase", "postgrest"]
      backend-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Reads pyproject.toml only; the .lock files are not regenerated, so the scan audits them.
  - package-ecosystem: pip
    directory: /EEGResearch
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sidecar-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /Website/AdaptiveLearning/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # First: a dependency joins the first group it matches. @vitest/* pin vitest's exact version.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # 7.1's compiler rules flag 14 existing sites (5 set-state-in-effect); lift once they are fixed.
    ignore:
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7.1.0"]

  # An action runs with the workflow's token, so a moving tag is a supply-chain path into CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
