[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-learning-platform"
version = "0.1.0"
description = "Secure real-time EEG-driven adaptive learning platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "starlette>=1.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "numpy>=2.0.0",
  "scipy>=1.14.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "httpx>=0.27.0",
  "pip-tools>=7.5.0"
]
# Camera capture. Optional is what keeps CI, the test suite and every
# headband-only deployment unchanged: the sidecar imports and boots with none of
# these installed, and only `connect()` on a face device needs them.
#
# Two packages, not three. There is deliberately no rPPG library here -- the
# pulse extraction is ours (`pos_rppg`, POS from Wang et al. 2017), because every
# packaged deep-learning rPPG carries weights trained on a dataset behind a
# per-requester agreement and the classical ones fail on licence or packaging.
# See the plan's Phase 4 dependency section before adding one.
# opencv is held below 5.0 deliberately. `face_roi.FaceLocator` depends on
# `cv2.data.haarcascades` shipping inside the wheel and on the CAP_PROP_*
# constants used to lock exposure, and neither has been exercised against a 5.x
# release here -- there is no OpenCV in CI, so a break would surface in front of
# a class rather than in a test run. Lift the cap deliberately, with the manual
# camera check from the plan's verification step, not by letting a resolver do
# it silently.
face = [
  "opencv-python>=4.9.0,<5",
  "onnxruntime>=1.17.0"
]

# Gaze, separately from `face`, because it is the only channel that needs
# MediaPipe and it is off by default. Emotion and the colour path do not, and a
# camera deployment that never enables gaze should not carry ~50 MB and a second
# ML runtime for a channel it does not run. Install both: `.[face,gaze]`.
#
# Held below 2.0 for the same reason opencv is held below 5, and with a worked
# example rather than a worry: **1.0.0 deleted `mp.solutions`**, the entire
# legacy Solutions API, which is what `face_landmarks` was originally written
# against. The symptom was `AttributeError: module 'mediapipe' has no attribute
# 'solutions'`, which reads as a broken install. There is no MediaPipe in CI, so
# the next major would surface the same way -- in front of a class.
gaze = [
  "mediapipe>=1.0,<2",
  # Not a direct import -- this is mediapipe's own dependency, constrained here
  # because it collides with `face` and the resolver will not notice.
  #
  # mediapipe requires `opencv-contrib-python` (unpinned), `face` requires
  # `opencv-python<5`, and **both distributions install the same `cv2` module**.
  # So `.[face,gaze]` -- the command the scripts tell an operator to run --
  # resolved to opencv-python 4.14 *and* opencv-contrib-python 5.0 side by side,
  # with whichever landed last owning the import.
  #
  # That silently defeats the cap above it. `FaceLocator` needs
  # `cv2.data.haarcascades` inside the wheel and the exposure lock needs the
  # CAP_PROP_* constants, neither exercised against 5.x here and neither covered
  # by CI, which has no OpenCV. Matching the majors is the least this can do;
  # the real fix is one cv2 provider, which means moving `face` onto
  # opencv-contrib-python and re-running the manual camera check.
  "opencv-contrib-python<5"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]
