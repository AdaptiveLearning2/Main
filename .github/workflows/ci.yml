name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eegresearch-tests:
    name: EEGResearch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.14, matching the local venvs. The minor, not the patch: setup-python
      # fails outright on an exact version the runner image lacks.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install EEGResearch (with dev deps)
        working-directory: EEGResearch
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: EEGResearch
        env:
          EEG_SOURCE: sim
          API_TOKEN: dummy-learner-token-for-ci
          ADMIN_TOKEN: dummy-admin-token-for-ci
        run: pytest

  native-bridge-build:
    name: Native bridge build
    # Windows, because the bridge includes <winsock2.h> and links Ws2_32 unconditionally.
    # ENABLE_LIBMUSE=OFF (the SDK cannot ship to CI): code inside those guards is not compiled.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: EEGResearch/native_bridge
        run: cmake -S . -B build -DENABLE_LIBMUSE=OFF

      - name: Build
        working-directory: EEGResearch/native_bridge
        run: cmake --build build --config Release

  website-backend:
    name: Website backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # requirements-dev.txt: runtime requirements via `-r`, plus pytest.
      - name: Install dependencies
        working-directory: Website/AdaptiveLearning/backend
        run: pip install -r requirements-dev.txt

      - name: Import sanity check
        working-directory: Website/AdaptiveLearning/backend
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
        run: python -c "import main"

      - name: Run tests
        working-directory: Website/AdaptiveLearning/backend
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -q
          else
            echo "no tests/ directory yet — skipping"
          fi

  database-grants:
    name: Database grants
    runs-on: ubuntu-latest
    # New functions and tables arrive granted to anon/authenticated by name, so only an
    # explicit REVOKE narrows them. A lint, because ALTER DEFAULT PRIVILEGES does not work.
    # Own job: stdlib text analysis, no Docker, under a second.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # The parser first: a regex over SQL fails quietly in both directions.
      - name: Self-test the parsers
        run: |
          python scripts/check_function_grants.py --self-test
          python scripts/check_table_grants.py --self-test

      - name: Check public-schema functions revoke EXECUTE
        run: python scripts/check_function_grants.py

      # Tables only have to revoke; what is granted back is per-table judgement, left to review.
      - name: Check public-schema tables revoke the default grants
        run: python scripts/check_table_grants.py

  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    # The only CI step that applies migrations ("Supabase Preview" is always skipped).
    # A local Supabase stack, not bare postgres: migrations need auth.uid() and the Supabase roles.
    steps:
      - uses: actions/checkout@v4

      # Matches the repo-local CLI in package.json; bump both together.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      # Skips services unused by SQL. logflare/vector are excluded despite [analytics]
      # enabled in config.toml; re-check that the CLI accepts this when bumping its pin.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      # A second application, so a failure here is a migration failure, not a container one.
      # --no-seed: seed.sql is gitignored; this step asserts only that migrations apply.
      - name: Apply migrations from scratch
        run: supabase db reset --no-seed

      # RLS needs a real Postgres; this is the only job with one.
      - name: Assert signal-table RLS and CHECK constraints
        run: psql "$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')" -v ON_ERROR_STOP=1 -f scripts/assert_signal_rls.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  frontend-build:
    name: Frontend tests, build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Website/AdaptiveLearning/frontend/package-lock.json

      - name: Install dependencies
        working-directory: Website/AdaptiveLearning/frontend
        run: npm ci

      # Non-blocking against a backlog of 14 pre-existing errors (count in CLAUDE.md; keep current).
      - name: Lint (non-blocking)
        continue-on-error: true
        working-directory: Website/AdaptiveLearning/frontend
        run: npm run lint

      # Blocking: extends no shared config, so it is red iff an XSS sink was added.
      # This is what lets the Supabase JWT stay in localStorage.
      - name: Lint XSS sinks (blocking)
        working-directory: Website/AdaptiveLearning/frontend
        run: npm run lint:sinks

      # Blocking, unlike lint.
      - name: Test
        working-directory: Website/AdaptiveLearning/frontend
        run: npm test

      - name: Build
        working-directory: Website/AdaptiveLearning/frontend
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: dummy-key-for-ci
          VITE_API_URL: http://localhost:8000
        run: npm run build

  # Known vulnerabilities in what we install. Blocking: a CVE is not a style backlog.
  # Three Python sets, since they are separate installs: backend, sidecar, and the committed .lock files.
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install pip-audit

      # Each audit is `continue-on-error` with an `id`, and the last step fails the job,
      # so one finding does not hide the rest.

      # Its own venv, so the sidecar is not audited at the backend's versions. The
      # environment, not the file: requirements.txt omits the transitive tree.
      - name: Audit the website backend
        id: audit-backend
        continue-on-error: true
        working-directory: Website/AdaptiveLearning/backend
        run: |
          # Outside the working tree, so a local reproduction leaves nothing to ignore.
          venv="$(mktemp -d)/venv"
          python -m venv "$venv"
          # Upgrade the venv's own pip rather than excluding it, so its advisories are not noise.
          "$venv/bin/pip" install --quiet --upgrade pip
          "$venv/bin/pip" install --quiet -r requirements-dev.txt
          # Asked for, not hardcoded: a wrong path audits an empty dir and reads as clean.
          pip-audit --path "$("$venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

      # Resolved from pyproject, as the `EEGResearch tests` job installs it.
      - name: Audit the EEG sidecar
        id: audit-sidecar
        continue-on-error: true
        working-directory: EEGResearch
        run: |
          venv="$(mktemp -d)/venv"
          python -m venv "$venv"
          "$venv/bin/pip" install --quiet --upgrade pip
          "$venv/bin/pip" install --quiet -e ".[dev]"
          # `--skip-editable`: the sidecar itself is not on PyPI.
          pip-audit --skip-editable \
            --path "$("$venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

      # `--no-deps`: a lock already names every version.
      - name: Audit the committed lock files
        id: audit-locks
        continue-on-error: true
        working-directory: EEGResearch
        run: |
          status=0
          for lock in requirements.lock requirements-dev.lock \
                      requirements-face.lock requirements-gaze.lock; do
            echo "::group::$lock"
            pip-audit -r "$lock" --no-deps || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Website/AdaptiveLearning/frontend/package-lock.json

      # `--omit=dev` is the gate: only shipped deps reach a browser. The full audit still prints.
      - name: Audit the frontend
        id: audit-frontend
        continue-on-error: true
        working-directory: Website/AdaptiveLearning/frontend
        run: |
          echo "::group::every advisory, including dev-only build tooling"
          npm audit || true
          echo "::endgroup::"
          npm audit --omit=dev --audit-level=high

      # The gate, naming each set. "Found something" and "never ran" both fail, with different messages.
      - name: Fail if any audit found something, or did not run
        if: always()
        run: |
          status=0
          for pair in \
            "website backend:${{ steps.audit-backend.outcome }}" \
            "EEG sidecar:${{ steps.audit-sidecar.outcome }}" \
            "committed lock files:${{ steps.audit-locks.outcome }}" \
            "frontend (shipped deps):${{ steps.audit-frontend.outcome }}"; do
            name="${pair%:*}"; outcome="${pair##*:}"
            case "$outcome" in
              success)
                ;;
              failure)
                echo "::error::$name has known vulnerabilities"
                status=1
                ;;
              *)
                # skipped, cancelled, or empty if the id stops matching a step.
                echo "::error::$name was not audited (step outcome: ${outcome:-none}); this is a broken job, not a clean result"
                status=1
                ;;
            esac
          done
          exit $status

  # Secrets that reached a commit.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history: a removed key is still served by its commit.
          fetch-depth: 0

      # The binary, not gitleaks-action, which needs a GITLEAKS_LICENSE for org repos.
      # Pinned by upstream's published digest, since a tag can move; bump both together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # `--redact` so a finding does not reprint the secret into the build log.
      - name: Scan history
        run: gitleaks detect --source . --redact --verbose
